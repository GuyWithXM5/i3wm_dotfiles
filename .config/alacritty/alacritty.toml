# Wallpaper-adaptive background (pywal writes only [colors.primary].background).
# ANSI palette stays default so red/green output keeps its colors.
[general]
import = ["~/.cache/wal/colors-alacritty.toml"]

[font]
size = 9.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[window]
opacity = 0.7

[window.padding]
x = 10
y = 10

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
